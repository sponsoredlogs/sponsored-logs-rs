[package]
name = "sponsored-logs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The world's first Log-Native Advertising Platform for Rust. Monetize your tracing exhaust."
license = "MIT"
repository = "https://github.com/sponsoredlogs/sponsored-logs-rs"
readme = "README.md"
keywords = ["logging", "tracing", "advertising", "observability", "satire"]
categories = ["development-tools::debugging"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
rand = "0.8"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "std"] }
